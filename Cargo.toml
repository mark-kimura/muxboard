[package]
name = "muxdock"
version = "0.1.0"
edition = "2024"
description = "A small desktop board for your projects: start, preview and manage a tmux session in each one, no tmux shortcuts needed"
license = "MIT"
repository = "https://github.com/mark-kimura/muxdock"
keywords = ["tmux", "gui", "egui", "claude-code", "terminal"]
categories = ["command-line-utilities", "gui"]

[dependencies]
dirs = "5"
eframe = "0.29"
egui = "0.29"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
